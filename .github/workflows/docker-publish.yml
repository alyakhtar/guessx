name: Build and Publish Docker Image

# Validate on every push (cheap: lint/type-check/build) so breakage is caught early.
# Publish a branch-tagged image (ghcr.io/<owner>/guessx:<branch-slug>) ONLY when a
# pull request is opened/updated for the branch (not on every push) to avoid
# rebuilding on every WIP commit. On main, also publish the `latest` tag.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate (lint / type-check / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run lint / type validation
        run: |
          if npm run --if-present --silent type-check; then echo "type-check passed"; fi
          if npm run --if-present --silent lint; then echo "lint passed"; fi
          npm run --if-present build || echo "no build script configured"

  # Build & push only when a PR is opened/updated (or pushed to main), not on
  # every feature-branch push. The branch slug becomes the image tag.
  build-and-push:
    name: Build and Push to GHCR
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set owner lowercase
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Derive branch slug
        id: branch
        run: |
          # Use the PR head ref for PR events, else the push branch name.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW="${{ github.head_ref }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          SLUG="${RAW//\//-}"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "is_main=${{ github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/guessx
          tags: |
            # Always tag with the branch slug (e.g. feature-private-rooms)
            type=raw,value=${{ steps.branch.outputs.slug }}
            # Only tag 'latest' when this is the main branch
            type=raw,value=latest,enable=${{ steps.branch.outputs.is_main }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
