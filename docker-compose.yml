services:
  guessx:
    image: ghcr.io/alyakhtar/guessx:latest
    container_name: guessx
    restart: unless-stopped
    ports:
      - "${PORT:-8082}:8082"
    env_file:
      - ./.env
    networks:
      - mongodb_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  mongodb_default:
    external: true
