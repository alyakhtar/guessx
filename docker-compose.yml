name: ${COMPOSE_PROJECT_NAME:-guessx}

services:
  guessx:
    # IMAGE can be overridden at deploy time so a feature branch can run a
    # locally-built image (e.g. IMAGE=guessx:feature-private-rooms).
    image: ${IMAGE:-ghcr.io/alyakhtar/guessx:latest}
    # CONTAINER_NAME is variable so a feature deploy doesn't collide with the
    # live "guessx" container. Default kept for backward compatibility.
    container_name: ${CONTAINER_NAME:-guessx}
    restart: unless-stopped
    ports:
      # HOST port is variable (default 8082); container always listens on 8082.
      - "${PORT:-8082}:8082"
    env_file:
      # Production uses ./.env by default. Set ENV_FILE=./.dev-env for a
      # development deployment from the same checkout.
      - path: ${ENV_FILE:-./.env}
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
