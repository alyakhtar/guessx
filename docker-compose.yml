services:
  guessx:
    image: ghcr.io/alyakhtar/guessx:latest
    container_name: guessx
    restart: unless-stopped
    ports:
      - "${PORT:-8082}:8082"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - PORT=8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
