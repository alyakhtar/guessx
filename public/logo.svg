<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GuessX logo</title>
  <desc id="desc">A neon cyan and violet X over a glowing target.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#122c70"/>
      <stop offset="0.62" stop-color="#06143d"/>
      <stop offset="1" stop-color="#020719"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ffff"/>
      <stop offset="0.25" stop-color="#15e8ff"/>
      <stop offset="0.7" stop-color="#0877ff"/>
      <stop offset="1" stop-color="#1238cc"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset="0.25" stop-color="#ff63ed"/>
      <stop offset="0.7" stop-color="#7319ff"/>
      <stop offset="1" stop-color="#3212a7"/>
    </linearGradient>
    <radialGradient id="gold" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.22" stop-color="#fff21a"/>
      <stop offset="0.7" stop-color="#ffb400"/>
      <stop offset="1" stop-color="#ff4b00"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="84" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="#0b2e87" opacity=".32" filter="url(#softGlow)"/>

  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="186" stroke="#078fff" stroke-width="4" stroke-dasharray="116 24 48 18" opacity=".9"/>
    <circle cx="256" cy="256" r="165" stroke="#11eaff" stroke-width="16" opacity=".78" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="165" stroke="#b9ffff" stroke-width="3" opacity=".95"/>
    <circle cx="256" cy="256" r="123" stroke="#ff8b00" stroke-width="6" stroke-dasharray="100 74" opacity=".95" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="101" stroke="#196cff" stroke-width="22" opacity=".52"/>
  </g>

  <g stroke="#ffbd18" stroke-linecap="round" filter="url(#glow)">
    <path d="M256 57v44M256 411v44M57 256h44M411 256h44" stroke-width="10"/>
  </g>

  <g fill="none" stroke="#39dfff" stroke-width="3" opacity=".8">
    <path d="M119 113l28 28M393 113l-28 28M119 399l28-28M393 399l-28-28"/>
  </g>

  <circle cx="256" cy="256" r="58" fill="#081743" stroke="#b8d9ff" stroke-width="7" opacity=".98"/>
  <circle cx="256" cy="256" r="43" fill="url(#gold)" stroke="#ffcf30" stroke-width="4" filter="url(#glow)"/>
  <circle cx="242" cy="241" r="10" fill="#fffde8" opacity=".9"/>

  <g stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <path d="M80 80 224 224 188 260 80 152Z" fill="url(#cyan)" stroke="#9cffff" stroke-width="4"/>
    <path d="M432 80 288 224 324 260 432 152Z" fill="url(#violet)" stroke="#ffd5ff" stroke-width="4"/>
    <path d="m80 432 144-144 36 36-108 108Z" fill="url(#violet)" stroke="#ffd5ff" stroke-width="4"/>
    <path d="m432 432-144-144-36 36 108 108Z" fill="url(#cyan)" stroke="#9cffff" stroke-width="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="151" y="61" fill="#12e8ff">2</text><text x="361" y="61" fill="#c05cff">8</text>
    <text x="61" y="263" fill="#12e8ff">4</text><text x="451" y="263" fill="#12e8ff">7</text>
    <text x="151" y="464" fill="#c05cff">3</text><text x="361" y="464" fill="#ffb414">5</text>
    <text x="76" y="386" fill="#b85cff">6</text><text x="436" y="386" fill="#12e8ff">9</text>
  </g>
</svg>
